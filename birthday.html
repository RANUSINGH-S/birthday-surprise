<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;color:#fff;
  background:radial-gradient(circle at 50% 30%,#3a1d6e,#150a2b 70%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;transition:opacity .6s}
.hidden{opacity:0;pointer-events:none}
h1{font-size:clamp(26px,6vw,44px);margin:12px 0 6px;font-weight:600}
p{font-size:clamp(16px,3.6vw,20px);margin:6px 0 22px;max-width:30em;line-height:1.4}
button{font:inherit;font-weight:600;font-size:clamp(18px,4vw,22px);border:0;border-radius:999px;padding:12px 34px;
  cursor:pointer;background:#ffd166;color:#3b1d00;box-shadow:0 6px 0 #c9962b;transition:transform .1s,box-shadow .1s}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #c9962b}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button.alt{background:#2f1a57;color:#fff;box-shadow:0 6px 0 #1a0d36;margin-left:12px}
.gift{font-size:clamp(90px,20vw,130px);animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

/* stage */
#stage{padding:0;display:block;background:#12081f}
#reveal{position:absolute;inset:0;overflow-y:auto;z-index:1;padding:7% 16px 30px;text-align:center;
  background:radial-gradient(circle at 50% 0,#4a2a86,#1a0d36 75%)}
.hb{font-size:clamp(28px,7vw,52px);font-weight:600}
.nm{font-family:'Pacifico',cursive;font-size:clamp(54px,15vw,110px);line-height:1.15;
  background:linear-gradient(90deg,#ffd166,#ff6f91,#4cc9f0);-webkit-background-clip:text;background-clip:text;color:transparent}
#lyric{min-height:1.6em;font-size:clamp(18px,4vw,26px);margin:8px 0;color:#ffd166}
.msg{max-width:28em;margin:0 auto 18px;font-size:clamp(15px,3.4vw,19px);line-height:1.45;opacity:.9}
#gallery{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;padding:10px 0 20px}
.pol{margin:0;background:#fff;padding:8px 8px 26px;border-radius:4px;box-shadow:0 8px 20px #0007;
  width:clamp(120px,28vw,190px);opacity:0;transform:scale(.4) rotate(0);transition:all .7s cubic-bezier(.2,1.4,.4,1)}
.pol.in{opacity:1;transform:scale(1) rotate(var(--r))}
.pol img{width:100%;height:auto;display:block;border-radius:2px}
.pol.empty{display:flex;align-items:center;justify-content:center;aspect-ratio:1;font-size:48px;color:#3b1d00}
.curtain{position:absolute;top:0;bottom:0;width:50.5%;z-index:2;
  background:repeating-linear-gradient(90deg,#7a1631 0 26px,#5a0e24 26px 52px);
  box-shadow:inset 0 0 60px #0009;transition:transform 2.6s cubic-bezier(.7,0,.3,1)}
.cl{left:0}.cr{right:0}
.open .cl{transform:translateX(-100%)}.open .cr{transform:translateX(100%)}
.valance{position:absolute;top:0;left:0;right:0;height:46px;z-index:3;border-bottom:6px solid #ffd166;
  background:repeating-linear-gradient(90deg,#8e1b3a 0 40px,#6b1229 40px 80px)}
#scene{position:absolute;inset:46px 0 0;z-index:4;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;transition:opacity 1s}
#scene.gone{opacity:0;pointer-events:none}
#label{font-size:clamp(16px,3.6vw,22px);min-height:1.4em;text-shadow:0 2px 6px #000a}
#count{font-size:clamp(70px,17vw,130px);line-height:1;font-weight:600;min-height:1em;text-shadow:0 4px 0 #0006}
#count.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(1.8);opacity:0}30%{opacity:1}100%{transform:scale(1)}}
svg{width:min(96vw,640px);height:auto;max-height:68%}
.flame{animation:flick .18s infinite alternate;transform-box:fill-box;transform-origin:center bottom;transition:opacity .3s}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.9,1.12)}}
.flame.out{animation:none;opacity:0;transform:scale(.1)}
.smoke{opacity:0;fill:none;stroke:#ddd;stroke-width:4;stroke-linecap:round}
.smoke.show{animation:rise 2s ease-out}
@keyframes rise{0%{opacity:.9;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.wind{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:0;stroke-dasharray:260;stroke-dashoffset:260}
.blow .wind{animation:gust 1.1s ease-out infinite}
@keyframes gust{0%{opacity:.9;stroke-dashoffset:260}70%{opacity:.9}100%{opacity:0;stroke-dashoffset:0}}
#mouthO{display:none}
.blow #mouthSmile{display:none}.blow #mouthO{display:block}
.cheek{transform-box:fill-box;transform-origin:center;transition:transform .3s}
.blow .cheek{transform:scale(1.35)}
#confetti{position:fixed;inset:0;z-index:20;pointer-events:none}
.sub{font-size:clamp(15px,3.4vw,20px);opacity:.85;margin:2px 0}
textarea{font:inherit;width:min(92vw,420px);height:90px;border-radius:14px;border:2px solid #ffd166;padding:12px;background:#2a1650;color:#fff;resize:none}
#dateline{position:absolute;left:0;right:0;top:8%;padding:0 22px;font-size:clamp(20px,4.6vw,30px);line-height:1.45;font-weight:600;opacity:0;transition:opacity 1s;text-shadow:0 3px 8px #000b}
#dateline.show{opacity:1}
.wishfloat{position:absolute;left:50%;bottom:50%;transform:translateX(-50%);max-width:80%;font-size:clamp(16px,3.6vw,22px);color:#ffe9a8;opacity:0;pointer-events:none;text-shadow:0 2px 6px #000}
.wishfloat.go{animation:floatup 5.5s ease-out forwards}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,0)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-170px)}}
@media (prefers-reduced-motion:reduce){.gift,.flame{animation:none}}
</style></head><body>

<section class="screen" id="s1">
  <div class="gift">🎁</div>
  <h1>Someone left you a surprise</h1>
  <p>A surprise for <span class="dtxt"></span>. Tap to open it.</p>
  <button id="openBtn">Open</button>
</section>

<section class="screen hidden" id="s2">
  <h1 id="q">Do you accept it, <span class="who"></span>?</h1>
  <p>Once you say yes, there is no turning back.</p>
  <div><button id="yes">Yes, I accept</button><button id="no" class="alt">No</button></div>
</section>

<section class="screen hidden" id="s3">
  <h1>Make a wish</h1>
  <p>Close your eyes, think of it, then type it here. It stays on your screen and is never saved.</p>
  <textarea id="wish" maxlength="100" placeholder="I wish…"></textarea>
  <div style="margin-top:18px"><button id="wishBtn">Wish made</button></div>
</section>

<section class="screen hidden" id="stage">
  <div id="reveal">
    <div class="hb">Happy Birthday</div>
    <div class="nm who"></div>
    <div class="sub dtxt"></div>
    <div id="lyric"></div>
    <div class="msg" id="msg"></div>
    <div id="gallery"></div>
    <button id="replay">Watch again</button>
  </div>
  <div class="curtain cl"></div><div class="curtain cr"></div><div class="valance"></div>
  <div id="scene">
    <div id="dateline"></div><div class="wishfloat" id="wf"></div><div id="label"></div><div id="count"></div>
    <svg id="svg" viewBox="0 0 640 440" aria-label="A boy about to blow out the candle on a cake">
      <ellipse cx="450" cy="412" rx="150" ry="16" fill="#e8dff7"/>
      <rect x="350" y="334" width="200" height="76" rx="14" fill="#ffe8c7"/>
      <path d="M350 346q25 22 50 0t50 0 50 0 50 0v-12h-200z" fill="#ff9ec4"/>
      <rect x="375" y="276" width="150" height="62" rx="12" fill="#c9f0e3"/>
      <path d="M375 288q19 18 37 0t38 0 37 0 38 0v-12H375z" fill="#ff9ec4"/>
      <rect x="400" y="230" width="100" height="48" rx="10" fill="#ffd166"/>
      <path d="M400 242q16 16 33 0t34 0 33 0v-12H400z" fill="#ff9ec4"/>
      <g fill="#ef476f"><circle cx="372" cy="380" r="4"/><circle cx="420" cy="390" r="4"/><circle cx="480" cy="378" r="4"/><circle cx="525" cy="392" r="4"/></g>
      <g fill="#4cc9f0"><circle cx="395" cy="372" r="4"/><circle cx="450" cy="384" r="4"/><circle cx="505" cy="370" r="4"/></g>
      <rect x="444" y="190" width="12" height="42" rx="3" fill="#4cc9f0"/>
      <path d="M444 202l12-6M444 214l12-6M444 226l12-6" stroke="#fff" stroke-width="3"/>
      <g id="flame" class="flame"><ellipse cx="450" cy="174" rx="9" ry="16" fill="#ff9f1c"/><ellipse cx="450" cy="178" rx="5" ry="10" fill="#ffe66d"/></g>
      <path id="smoke" class="smoke" d="M450 184q-10-20 2-35t-2-34"/>
      <!-- boy -->
      <ellipse cx="170" cy="420" rx="92" ry="84" fill="#4cc9f0"/>
      <rect x="152" y="290" width="36" height="40" fill="#f2c29b"/>
      <circle cx="100" cy="240" r="12" fill="#ffd7b5"/><circle cx="240" cy="240" r="12" fill="#ffd7b5"/>
      <circle cx="170" cy="235" r="70" fill="#ffd7b5"/>
      <path d="M98 232C94 150 148 148 170 150c30-2 76 14 72 82-16-30-38-42-72-42s-58 12-72 42z" fill="#3a2418"/>
      <path d="M130 220q14-8 28 0M182 220q14-8 28 0" stroke="#3a2418" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="145" cy="243" rx="8" ry="11" fill="#2b1a12"/><ellipse cx="195" cy="243" rx="8" ry="11" fill="#2b1a12"/>
      <circle cx="148" cy="239" r="3" fill="#fff"/><circle cx="198" cy="239" r="3" fill="#fff"/>
      <ellipse class="cheek" cx="126" cy="266" rx="12" ry="7" fill="#ff8fa3" opacity=".75"/>
      <ellipse class="cheek" cx="214" cy="266" rx="12" ry="7" fill="#ff8fa3" opacity=".75"/>
      <path id="mouthSmile" d="M152 270q18 18 36 0" stroke="#8b2e3c" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse id="mouthO" cx="170" cy="274" rx="8" ry="10" fill="#8b2e3c"/>
      <path class="wind" d="M208 270Q310 262 425 200"/><path class="wind" style="animation-delay:.2s" d="M206 278Q320 284 428 212"/>
      <path class="wind" style="animation-delay:.4s" d="M206 262Q300 236 424 188"/>
    </svg>
  </div>
</section>
<canvas id="confetti"></canvas>

<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
document.querySelectorAll('.who').forEach(e => e.textContent = D.name);
$('msg').textContent = D.message;
document.querySelectorAll('.dtxt').forEach(e => e.textContent = D.dateLong);
let ac;

function go(id){ ['s1','s2','s3','stage'].forEach(s => $(s).classList.toggle('hidden', s !== id)); }

/* ---------- sound ---------- */
function tone(f, t, d, vol=.3){
  const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o2.type = 'sine'; o.frequency.value = f; o2.frequency.value = f*2;
  o.connect(g); o2.connect(g); g.connect(ac.destination);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.03);
  g.gain.exponentialRampToValueAtTime(.001, t+d*.95);
  o.start(t); o2.start(t); o.stop(t+d); o2.stop(t+d);
}
function beep(f){ if(ac) tone(f, ac.currentTime, .25, .2); }
function whoosh(){
  if(!ac) return;
  const n = ac.sampleRate*.8, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = b; f.type = 'bandpass'; f.frequency.value = 900; g.gain.value = .35;
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
}
const N = {G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
const SONG = [
  ['Happy birthday to you',        [['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2]]],
  ['Happy birthday to you',        [['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2]]],
  ['Happy birthday dear ' + D.name,[['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2]]],
  ['Happy birthday to you',        [['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',3]]],
];
function playSong(onEnd){
  if(D.song){ const a = new Audio(D.song); a.onended = onEnd; a.play().catch(onEnd); $('lyric').textContent = '🎶'; return; }
  const beat = .55; let t = ac.currentTime + .2, ms = 200;
  SONG.forEach(([text, notes]) => {
    setTimeout(() => $('lyric').textContent = text, ms);
    notes.forEach(([n, b]) => { tone(N[n], t, b*beat); t += b*beat; ms += b*beat*1000; });
  });
  setTimeout(() => { $('lyric').textContent = 'Many happy returns! ✨'; onEnd(); }, ms);
}

/* ---------- confetti ---------- */
const cv = $('confetti'), cx = cv.getContext('2d'); let parts = [];
const COL = ['#ffd166','#ff6f91','#4cc9f0','#9ae6b4','#fff'];
function fit(){ cv.width = innerWidth; cv.height = innerHeight; } fit(); addEventListener('resize', fit);
function burst(n){
  for(let i=0;i<n;i++) parts.push({x:Math.random()*cv.width,y:-10,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,
    s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:COL[i%COL.length]});
}
(function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r);
    cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6); cx.restore(); });
  parts = parts.filter(p => p.y < cv.height+20);
  requestAnimationFrame(loop);
})();

/* ---------- flow ---------- */
$('openBtn').onclick = () => { ac = new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); go('s2'); };
let tries = 0; const no = $('no');
function flee(e){ if(e) e.preventDefault(); tries++;
  no.style.transform = `translate(${(Math.random()-.5)*180}px,${(Math.random()-.5)*110}px)`;
  if(tries > 2) $('q').textContent = 'That button is shy. Try the other one!'; }
no.onmouseenter = flee; no.ontouchstart = flee; no.onclick = flee;

$('yes').onclick = () => { go('s3'); setTimeout(() => $('wish').focus(), 300); };
let wishText = '';
$('wishBtn').onclick = () => {
  wishText = $('wish').value.trim(); go('stage'); $('label').textContent = 'Hold your wish in your heart…';
  let n = 10; tick(n);
  const iv = setInterval(() => { n--; if(n > 0) tick(n); else { clearInterval(iv); blow(); } }, 1000);
};
function tick(n){
  const c = $('count'); c.textContent = n; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
  beep(n <= 3 ? 880 : 660);
}
function blow(){
  $('count').textContent = ''; $('label').textContent = '';
  $('svg').classList.add('blow'); whoosh();
  setTimeout(() => {
    $('flame').classList.add('out'); $('smoke').classList.add('show');
    if(wishText){ $('wf').textContent = '✨ ' + wishText; $('wf').classList.add('go'); }
  }, 900);
  setTimeout(() => {
    $('svg').classList.remove('blow');
    $('dateline').textContent = `It’s ${D.dateShort}, a precious day when a beautiful person was born with a beautiful heart. 💛`;
    $('dateline').classList.add('show');
  }, 2300);
  setTimeout(() => {
    $('dateline').classList.remove('show'); $('scene').classList.add('gone');
    setTimeout(() => $('stage').classList.add('open'), 700); setTimeout(celebrate, 2000);
  }, 8000);
}
function celebrate(){
  burst(180); const rep = setInterval(() => burst(25), 700); setTimeout(() => clearInterval(rep), 12000);
  playSong(() => {});
  const g = $('gallery'); g.innerHTML = '';
  const items = D.photos.length ? D.photos : ['🎂','🎈','🎉'];
  items.forEach((src, i) => {
    const f = document.createElement('figure'); f.className = 'pol';
    f.style.setProperty('--r', ((Math.random()*10)-5).toFixed(1) + 'deg');
    if(D.photos.length){ const im = new Image(); im.src = src; im.alt = 'Birthday photo ' + (i+1); f.appendChild(im); }
    else { f.classList.add('empty'); f.textContent = src; }
    g.appendChild(f); setTimeout(() => f.classList.add('in'), 400 + i*350);
  });
}
$('replay').onclick = () => location.reload();
</script></body></html>
